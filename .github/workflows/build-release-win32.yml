name: Build OrcOutFit Win32
# run-name (приоритет):
# 1) release — название релиза, иначе tag_name;
# 2) push — пустая строка → GitHub берёт дефолт = ТОЛЬКО заголовок коммита
#    (первая строка). head_commit.message нельзя: он тянет весь месседж
#    (заголовок + тело), а split/regex в выражениях нет;
# 3) workflow_dispatch — «manual · ветка (#run)»;
# 4) иначе — тоже дефолт (пустая строка).
run-name: ${{ github.event_name == 'release' && (github.event.release.name || github.event.release.tag_name) || github.event_name == 'workflow_dispatch' && format('manual · {0} (#{1})', github.ref_name, github.run_number) || '' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build static OpenAL Soft (Win32)
        shell: pwsh
        env:
          ORC_OPENAL_TOOLSET: v143
        run: .\.github\scripts\build-openal-soft.ps1 -Configuration Release

      - name: Build plugin-sdk Plugin.lib
        shell: pwsh
        run: |
          $env:PLUGIN_SDK_DIR = "$PWD/source/external/plugin-sdk"
          msbuild source/external/plugin-sdk/plugin_sa/Plugin_SA.vcxproj /t:Build "/p:Configuration=Release;Platform=Win32;PlatformToolset=v143"

      - name: Build Release Win32 (Full)
        shell: pwsh
        run: msbuild OrcOutFit.sln /t:Build "/p:Configuration=Release;Platform=x86;PlatformToolset=v143;OrcBuildPdb=false" /p:OrcOpenAlSkipPreBuild=true

      - name: Build Release Win32 (Lite)
        shell: pwsh
        run: msbuild OrcOutFit.sln /t:Build "/p:Configuration=Release;Platform=x86;PlatformToolset=v143;OrcEdition=Lite;OrcBuildPdb=false" /p:OrcOpenAlSkipPreBuild=true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrcOutFit-Release-Win32
          path: |
            build/Release/OrcOutFit.asi
            build/Release/OrcOutFitLite.asi
          if-no-files-found: error
          retention-days: 30

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/OrcOutFit.asi
            build/Release/OrcOutFitLite.asi
